[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attribution-suite"
version = "2.0.24"
description = "One install and one CLI over the attribution-graph toolchain"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tushar Karumudi" }]
keywords = ["osint", "attribution", "threat-intelligence", "entity-resolution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # Minimums, not decoration: the runner calls `Engine.run(before_resolve=...)`
  # which arrived in attribution-graph 2.0.6, and passes `sharing_domains` and
  # `holder_counts` to `paytrace.adversarial.assess_identifier`, which arrived
  # in paytrace 2.0.24. With the old `>=2.0.1` pins, upgrading only this
  # package resolved to siblings without those APIs and every run died with
  # `TypeError: Engine.run() got an unexpected keyword argument`.
  "attribution-graph>=2.0.8,<2.1",
  "paytrace>=2.0.26,<2.1",
  "handle-correlation>=2.0.1,<2.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.40"]
# `mcp` is in dev so CI actually imports the server. Without it the MCP
# tests skipped everywhere, and the server shipped broken against the
# SDK generation that `pipx inject` installs.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mcp>=1.0"]

[project.scripts]
attribution-mcp = "attribution_suite.mcp_server:main"
attribution = "attribution_suite.cli:_cli"
attribution-suite = "attribution_suite.cli:_suite_cli"

[project.urls]
Homepage = "https://github.com/tusharkarumudi/attribution-suite"

[tool.hatch.build.targets.wheel]
packages = ["src/attribution_suite"]

# The skill lives INSIDE the package (src/attribution_suite/skill/), so the
# packages entry above already ships it -- no force-include, which duplicated
# the path and made the wheel unbuildable. It used to sit in a top-level
# skill/ directory, where it existed only in a git checkout: everyone who
# installed from PyPI got a tool whose agent-facing half was missing.

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated, not written. `attribution_portable.py` is assembled by
# scripts/build_portable.py from the real modules; linting it reports on
# base64 payload lines, and "fixing" it would be edited away on the next
# rebuild. The sources it is built from are linted.
extend-exclude = ["src/attribution_suite/skill/attribution_portable.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP017"]

[tool.pytest.ini_options]
# Explicit taxonomy. A developer should not need implicit environmental
# knowledge to make `pytest` green: network and browser tests fail on a
# machine without DNS or Chromium, and that is an environment fact rather
# than a defect.
#
#   pytest                      # deterministic subset, the release gate
#   pytest -m network           # needs outbound DNS/HTTP
#   pytest -m browser           # needs a headless browser
testpaths = ["tests"]
markers = [
    "network: requires outbound network access",
    "browser: requires a headless browser (playwright/chromium)",
    "integration: spans more than one package",
    "adversarial: injection, obfuscation and SSRF regressions",
    "slow: takes more than a second",
]
addopts = "-m 'not network and not browser'"
